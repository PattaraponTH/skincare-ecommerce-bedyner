<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Categories Management — GLOWTIME Staff &amp; Admin</title>
  <meta name="description" content="GLOWTIME Admin — จัดการหมวดหมู่สินค้า เพิ่ม แก้ไข และซ่อนหมวดหมู่"/>
  <script>if(localStorage.getItem('adminLoggedIn')==='true'||sessionStorage.getItem('adminLoggedIn')==='true')document.documentElement.classList.add('admin-logged-in');</script>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>

<!-- AUTH OVERLAY -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <span class="auth-badge">GLOWTIME · Admin Protection</span>
    <h2 class="auth-title">Admin Authentication</h2>
    <p class="auth-desc">กรุณาลงชื่อเข้าใช้เพื่อเข้าสู่ระบบ</p>
    <form onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Username / Email</label>
        <input type="text" id="adminUser" class="form-control" value="admin" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" class="form-control" value="password123" required>
      </div>
      <button type="submit" class="btn-submit">Sign In to Dashboard</button>
    </form>
  </div>
</div>

<div class="admin-container">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <header class="topbar"
      data-title="Categories"
      data-sub="จัดการหมวดหมู่สินค้า เพิ่ม แก้ไข และปรับสถานะการแสดงผล">
    </header>

    <!-- STAT SUMMARY -->
    <div class="stats-grid" id="categoryStats" style="margin-bottom:2rem;">
      <!-- Rendered by JS -->
    </div>

    <!-- CATEGORIES TABLE -->
    <div class="content-card">
      <div class="card-header">
        <div>
          <h3 class="card-title">Product Categories</h3>
          <p style="font-size:0.75rem; color:var(--gray); margin-top:0.2rem;">จัดการหมวดหมู่ทั้งหมดในระบบ</p>
        </div>
        <div style="display:flex; gap:0.6rem; align-items:center;">
          <div class="search-box" style="width:200px;">
            <span style="color:var(--gray); font-size:0.8rem;">&#x2315;</span>
            <input type="text" id="categorySearch" placeholder="Search categories...">
          </div>
          <button class="btn-dark-sm" onclick="openAddCategoryModal()">+ Add Category</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Category</th>
              <th>Product Count</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categoryTableBody">
            <tr><td colspan="4"><div class="skeleton-row"></div></td></tr>
            <tr><td colspan="4"><div class="skeleton-row"></div></td></tr>
            <tr><td colspan="4"><div class="skeleton-row"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- MODAL: ADD / EDIT CATEGORY -->
<div class="modal-backdrop" id="modalAddCategory">
  <div class="modal-box" style="max-width:520px;">
    <div class="modal-header">
      <h3 class="modal-title" id="categoryModalTitle">Add New Category</h3>
      <button class="modal-close" type="button" onclick="closeModal('modalAddCategory')">✕</button>
    </div>
    <form onsubmit="saveCategory(event)" id="categoryForm">
      <input type="hidden" id="editCatId" value="">

      <div style="display:grid; grid-template-columns:1fr 80px; gap:0.8rem;">
        <div class="form-group">
          <label>Category Name <span style="color:var(--status-danger);">*</span></label>
          <input type="text" id="catName" class="form-control" required placeholder="e.g. Toner">
        </div>
        <div class="form-group">
          <label>Icon</label>
          <input type="text" id="catIcon" class="form-control" value="📦" maxlength="4" style="text-align:center; font-size:1.2rem;">
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <input type="text" id="catDescription" class="form-control" placeholder="e.g. Balancing toners and essences">
      </div>

      <div class="form-group">
        <label>Status <span style="color:var(--status-danger);">*</span></label>
        <select class="form-control" id="catStatus">
          <option value="Active">Active — แสดงในร้าน</option>
          <option value="Hidden">Hidden — ซ่อนจากลูกค้า</option>
        </select>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.6rem; margin-top:1.2rem;">
        <button type="button" class="btn-ghost-sm" onclick="closeModal('modalAddCategory')">Cancel</button>
        <button type="submit" class="btn-dark-sm">Save Category</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/shared.js"></script>
<script src="js/topbar.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/categories.js"></script>
</body>
</html>
