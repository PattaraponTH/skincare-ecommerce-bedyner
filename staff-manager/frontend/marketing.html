<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Promotions &amp; Bundles — GLOWTIME Staff &amp; Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script>if(localStorage.getItem('adminLoggedIn')==='true'||sessionStorage.getItem('adminLoggedIn')==='true')document.documentElement.classList.add('admin-logged-in');</script>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>

<!-- ── AUTH LOCK OVERLAY ── -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <span class="auth-badge">GLOWTIME · Staff & Manager Portal</span>
    <h2 class="auth-title">Admin Authentication</h2>
    <p class="auth-desc">Please sign in with Manager account</p>
    <form onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="adminUser" class="form-control" value="manager01@gmail.com" required placeholder="manager01@gmail.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" class="form-control" value="123456" required>
      </div>
      <button type="submit" class="btn-submit">Sign In to Dashboard</button>
    </form>
  </div>
</div>

<!-- ── MAIN LAYOUT ── -->
<div class="admin-container">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <header class="topbar" data-title="Promotions &amp; Bundles" data-sub="Bundle sets, flash sale campaigns, and cart recovery alerts"></header>

    <!-- BUNDLE SETS -->
    <div class="content-card">
      <div class="card-header">
        <h3 class="card-title">Promotions & Campaigns</h3>
        <button class="btn-dark-sm" onclick="showToast('Opening Create Promotion form...')">+ Create Promotion</button>
      </div>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Type</th>
              <th>Discount</th>
              <th>Period</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="promotionsTbody">
            <tr><td colspan="5" style="text-align:center; color:var(--gray); padding:1.5rem;">กำลังโหลดข้อมูล...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- CART RECOVERY TRIGGER -->
    <div class="content-card">
      <div class="card-header">
        <h3 class="card-title">Cart Recovery Trigger</h3>
        <button class="btn-dark-sm" onclick="showToast('Push alert sent to 14 customers with abandoned carts!')">Send Push Alert</button>
      </div>
      <p style="font-size:0.85rem; color:#777; padding: 0 0 0.5rem;">
        <strong>14 customers</strong> have had items in their cart for over 2 hours (total pending value: <strong>฿18,200</strong>)
      </p>
    </div>

  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/shared.js"></script>
<script src="js/topbar.js"></script>
<script src="js/sidebar.js"></script>
<script>
async function loadPromotions() {
  if (!window.GlowtimeAdminAPI) return;
  try {
    const promos = await window.GlowtimeAdminAPI.Marketing.list();
    const tbody = document.getElementById('promotionsTbody');
    if (!tbody || !Array.isArray(promos) || promos.length === 0) return;
    tbody.innerHTML = promos.map(p => `
      <tr>
        <td><strong>${p.title}</strong><br><span style="font-size:0.72rem;color:var(--gray);">${p.description || ''}</span></td>
        <td><span class="status-badge badge-info">${p.type || '-'}</span></td>
        <td>${p.discount ? p.discount + '%' : '-'}</td>
        <td style="font-size:0.78rem;">${p.startDate || '-'} → ${p.endDate || '-'}</td>
        <td><span class="status-badge badge-${
          p.status === 'Active' ? 'success' : p.status === 'Scheduled' ? 'warning' : 'danger'
        }">${p.status}</span></td>
      </tr>`);
  } catch (e) { console.warn('[marketing] load error:', e.message); }
}
document.addEventListener('DOMContentLoaded', loadPromotions);
</script>
</body>
</html>
