<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory &amp; Batches — GLOWTIME Staff &amp; Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script>if(localStorage.getItem('adminLoggedIn')==='true'||sessionStorage.getItem('adminLoggedIn')==='true')document.documentElement.classList.add('admin-logged-in');</script>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>

<!-- ── AUTH LOCK OVERLAY ── -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <span class="auth-badge">GLOWTIME · Staff & Manager Portal</span>
    <h2 class="auth-title">Admin Authentication</h2>
    <p class="auth-desc">Please sign in to access admin system</p>
    <form onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Username / Email</label>
        <input type="text" id="adminUser" class="form-control" value="manager01@gmail.com" required placeholder="manager01@gmail.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" class="form-control" value="123456" required>
      </div>
      <button type="submit" class="btn-submit">Sign In to Dashboard</button>
    </form>
  </div>
</div>

<!-- ── MAIN LAYOUT ── -->
<div class="admin-container">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <header class="topbar" data-title="Inventory &amp; Batches" data-sub="Track batch/lot numbers, expiry warnings, suppliers, and cost price"></header>

    <!-- BATCH & LOT TRACEABILITY TABLE -->
    <div class="content-card">
      <div class="card-header">
        <h3 class="card-title">Inventory &amp; Batches</h3>
        <button class="btn-dark-sm" onclick="showToast('Opening Receive New Lot Batch form...')">+ Receive New Lot</button>
      </div>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Batch / Lot No.</th>
              <th>Product Name</th>
              <th>Supplier</th>
              <th>Cost Price</th>
              <th>Qty Received</th>
              <th>MFG Date</th>
              <th>EXP Date</th>
              <th>Lot Status</th>
            </tr>
          </thead>
          <tbody id="inventoryTbody">
            <tr><td colspan="8" style="text-align:center; color:var(--gray); padding:1.5rem;">กำลังโหลดข้อมูล...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/shared.js"></script>
<script src="js/topbar.js"></script>
<script src="js/sidebar.js"></script>
<script>
async function loadInventory() {
  if (!window.GlowtimeAdminAPI) return;
  try {
    const lots = await window.GlowtimeAdminAPI.Inventory.getLots();
    const tbody = document.getElementById('inventoryTbody');
    if (!tbody || !Array.isArray(lots) || lots.length === 0) return;
    tbody.innerHTML = lots.map(lot => `
      <tr>
        <td><strong>${lot.lotNo}</strong></td>
        <td>${lot.productName}</td>
        <td>${lot.supplier}</td>
        <td>-</td>
        <td>${lot.qtyReceived} units</td>
        <td>-</td>
        <td>${lot.expDate || '-'}</td>
        <td><span class="status-badge badge-${
          lot.status === 'In Stock' ? 'success' : lot.status === 'Low Stock' ? 'warning' : 'danger'
        }">${lot.status}</span></td>
      </tr>
    `).join('');
  } catch (e) { console.warn('[inventory] load error:', e.message); }
}
document.addEventListener('DOMContentLoaded', loadInventory);
</script>
</body>
</html>
